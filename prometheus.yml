global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # - job_name: 'youdrive-api'
  #   basic_auth:
  #     username: admin
  #     password: admin
  #   static_configs:
  #     - targets: ['youdrive-api:3000']
  #   metrics_path: /api/metrics

  - job_name: 'youdrive-api'
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ['youdrive-api:3000']
    metrics_path: /api/metrics

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
