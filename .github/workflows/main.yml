name: deploy

on:
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/youdrive:latest
      - name: Build and push to Render
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.render
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.COMPOSE_SERVICE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.COMPOSE_SERVICE }}:${{ github.sha }}
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          script: |
            cd ${{ secrets.AWS_DIR }}
            docker-compose down ${{ secrets.COMPOSE_SERVICE }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/youdrive:latest
            docker-compose up -d ${{ secrets.COMPOSE_SERVICE }}
